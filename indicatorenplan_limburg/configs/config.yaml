    d21a:
      name: "D_21a Aantal MKB bedrijven in Limburg met proces- en productinnovaties"
      metadata: ["onderwerpen"]
    d21b:
        name: "D_21b Aantal MKB bedrijven in innovatieve samenwerkingsverbanden"
        metadata: ["onderwerpen"]
    d23a:
      name: "D_23a Aantal startende innovatieve bedrijven"
      metadata: ["onderwerpen"]


